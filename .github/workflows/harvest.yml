name: Harvest wires

on:
  schedule:
    - cron: "17 */2 * * *"     # every two hours, at :17
  workflow_dispatch:            # run by hand from the Actions tab
  push:
    paths:
      - "harvest.py"
      - "sources.json"
      - ".github/workflows/harvest.yml"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read every wire and write wire.json
        run: python3 harvest.py

      - name: Commit if the feed changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wire.json
          if git diff --cached --quiet; then
            echo "No change to wire.json"
          else
            COUNT=$(python3 -c "import json;print(json.load(open('wire.json'))['counts']['stories'])")
            git commit -m "wire: $COUNT stories ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
