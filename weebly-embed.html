<body style="margin:0; background:#05070e;">
<div class="bsg">

    <header class="bsg-hero">
        <h1>Four places where life <em>might</em> already be</h1>
        <p class="bsg-lede">
            <strong>No confirmed extraterrestrial life has been discovered.</strong>
            Each arc is an estimate of how likely that world's evidence is biological rather than chemical;
            the rail below keeps their real distance from Earth, logarithmically. Select a world for the detail.
        </p>
    </header>

    <div class="bsg-body">
        <div class="bsg-stage" id="bsgStage">
            <svg class="bsg-starfield" id="bsgStars" aria-hidden="true"></svg>
            <div class="bsg-rail" id="bsgRail"></div>
            <div class="bsg-rail-cap" style="left: 1.1rem;">Near</div>
            <div class="bsg-rail-cap" style="right: 1.1rem;">Far</div>
        </div>

        <aside class="bsg-detail" id="bsgDetail" aria-live="polite"></aside>
    </div>



    <section class="bsg-feed" id="bsgFeed" aria-label="Live astrobiology news feed">
        <div class="bsg-feed-head">
            <div>
                <h2 class="bsg-feed-title"><span class="bsg-dot idle" id="bsgDot"></span> Live coverage</h2>
                <p class="bsg-feed-sub" id="bsgStatus">Loading the wire…</p>
            </div>
            <div class="bsg-head-tools">
                <input class="bsg-search" id="bsgSearch" type="search" placeholder="plume, dimethyl sulfide, Perseverance…" aria-label="Filter headlines">
                <button class="bsg-link" id="bsgClear">Clear</button>
                <button class="bsg-link" id="bsgRefresh">Refresh</button>
            </div>
        </div>
        <div class="bsg-progress"><div class="bsg-progress-fill" id="bsgProgress"></div></div>

        <div class="bsg-filters">
            <div class="bsg-frow bsg-scrollrow" id="bsgTopicChips"><span class="bsg-fkey">Subject</span></div>
            <div class="bsg-frow bsg-scrollrow" id="bsgLangChips"><span class="bsg-fkey">Language</span><span class="bsg-tr"><label for="bsgTr" class="bsg-trlabel">Translate to</label><select id="bsgTr" aria-label="Translate the feed"></select></span></div>
        </div>

        <div class="bsg-notes">
        <div class="bsg-note">
            <h3>What the numbers are</h3>
            <p>Drawn from peer-reviewed work, NASA and ESA mission data, expert consensus and habitability assessments. A definitive claim requires 5-sigma confidence — about 99.99997% certainty.</p>
        </div>
        <div class="bsg-note">
            <h3>Why they stay low</h3>
            <p>Independent confirmations are required and every abiotic explanation ruled out first. Promising signals have repeatedly proved to be non-biological chemistry. Every biosignature here is inconclusive.</p>
        </div>
        <div class="bsg-note">

        </div>
    </div>
        <p class="bsg-note">

                    snippets are the publishers' own and every row links to the original. A wire that returns zero is

<script>
(function () {
'use strict';

/* ============================================================
   1. The worlds
   ============================================================ */
const WORLDS = [
    {
        id: 'mars', name: 'Mars', color: '#e07a5f',
        sub: 'Cheyava Falls, Jezero Crater',
        where: '140 million miles · Jezero Crater',
        prob: '3–8%', probMid: 5.5, logX: 0.13, size: 0.30, x: 17, y: 60,
        note: 'Strongest evidence to date. Only returned samples can confirm it.',
        badge: 'Strongest candidate',
        evidence: 'Leopard-spot textures carrying vivianite and greigite alongside organic molecules. On Earth, patterns like these form where microbes have processed sediment.',
        status: 'Peer-reviewed in Nature, September 2025. The rock is 2 to 3 billion years old. Non-biological chemistry cannot be ruled out from orbit or from the rover deck.',
        mission: 'Mars Sample Return', when: '2030 – 2039',
        missionText: 'Earth Return Orbiter around 2030, Sample Retrieval Lander around 2031, samples on Earth between 2035 and 2039. Architecture under review until mid-2026. China\u2019s Tianwen-3 may return samples as early as 2031.'
    },
    {
        id: 'europa', name: 'Europa', color: '#e6b98c',
        sub: 'Jupiter II',
        where: '390 million miles · moon of Jupiter',
        prob: '5–15%', probMid: 10, logX: 0.35, size: 0.34, x: 40, y: 30,
        note: 'Highest habitability score in the solar system. No biosignature yet.',
        badge: 'Prime target',
        evidence: 'A liquid ocean beneath 15 to 25 km of ice, holding organic molecules and energy sources — every ingredient life is known to require.',
        status: 'The ocean is likely in contact with a rocky seafloor, which would drive hydrothermal chemistry. Nothing resembling a biosignature has been detected.',
        mission: 'Europa Clipper', when: 'Arrives 2030',
        missionText: 'Launched October 2024. More than 50 close flybys to assess the ocean\u2019s habitability and search for biosignatures venting through the ice.'
    },
    {
        id: 'enceladus', name: 'Enceladus', color: '#9fd8ee',
        sub: 'Saturn II',
        where: '790 million miles · moon of Saturn',
        prob: '10–20%', probMid: 15, logX: 0.56, size: 0.30, x: 63, y: 58, gap: 30,
        note: 'Best conditions for life existing now, anywhere in the solar system.',
        badge: 'Prime target',
        evidence: 'Cryovolcanic plumes throw ocean water into space, where spacecraft can fly through it. October 2025 analyses found complex organics, including aromatic compounds, amino acids and phosphorus.',
        status: 'Caroline Freissinet, NASA astrobiologist, described every condition for life to arise and persist being present in one place at one time. Hydrothermal activity is evident. The plume samples the ocean directly.',
        mission: 'Enceladus Orbilander', when: 'Launch 2038 · Landing early 2050s',
        missionText: 'Proposed NASA Flagship, roughly $4.9B, project start FY2029. A 7.5-year cruise, a 4.5-year Saturn tour, 1.5 years in orbit, then two years on the surface searching for biosignatures.'
    },
    {
        id: 'k2-18b', name: 'K2-18 b', color: '#7aa7ff',
        sub: 'Leo, 124 light-years',
        where: '730 trillion miles · constellation Leo',
        prob: '<1%', probMid: 0.8, logX: 0.94, size: 0.40, x: 84, y: 27,
        note: 'Extremely low. The signal itself is still unconfirmed.',
        badge: 'Highly controversial',
        evidence: 'A tentative dimethyl sulfide detection at 3-sigma. On Earth, DMS comes almost entirely from marine phytoplankton.',
        status: 'A NASA reanalysis in July 2025 found no conclusive evidence. The signal sits below the 5-sigma threshold. The planet may be a gas-rich mini-Neptune with no habitable surface at all.',
        mission: 'JWST observations', when: '2026 · ongoing',
        missionText: '16 to 24 further hours of JWST time, aiming at 5-sigma. ESA\u2019s Ariel, launching 2029, will provide comparative atmospheres across many exoplanets.'
    }
];

const ARC_MAX = 25;   // the arc spans 0–25% P(life), so 15% reads as most of the ring

/* ---- Illustrated spheres. viewBox is 200×200, sphere r=62 at (100,100). ---- */
function surface(id) {
    if (id === 'mars') return `
        <circle cx="100" cy="100" r="62" fill="url(#g-mars)"/>
        <path d="M64 84c14-9 27-4 38 3s24 9 36 2" stroke="#8f3a26" stroke-width="11" fill="none" opacity=".33" stroke-linecap="round"/>
        <ellipse cx="82" cy="118" rx="20" ry="11" fill="#7d3220" opacity=".28" transform="rotate(-14 82 118)"/>
        <ellipse cx="124" cy="76" rx="13" ry="8" fill="#7d3220" opacity=".22" transform="rotate(12 124 76)"/>
        <ellipse cx="100" cy="47" rx="17" ry="6" fill="#fdf3ec" opacity=".78"/>
        <ellipse cx="100" cy="154" rx="12" ry="5" fill="#fdf3ec" opacity=".5"/>
        <circle cx="100" cy="100" r="62" fill="url(#shade)"/>`;
    if (id === 'europa') return `
        <circle cx="100" cy="100" r="62" fill="url(#g-europa)"/>
        <g stroke="#a8623c" fill="none" opacity=".55" stroke-linecap="round">
            <path d="M42 88c26 10 62 6 92-10" stroke-width="2.1"/>
            <path d="M46 112c30 5 66-4 90-22" stroke-width="1.5" opacity=".7"/>
            <path d="M58 62c14 22 44 36 82 34" stroke-width="1.8"/>
            <path d="M62 140c22-14 52-16 84-6" stroke-width="1.4" opacity=".65"/>
            <path d="M92 40c-6 40 2 78 20 118" stroke-width="1.2" opacity=".5"/>
        </g>
        <circle cx="100" cy="100" r="62" fill="url(#shade)"/>`;
    if (id === 'enceladus') return `
        <g opacity=".55">
            <path d="M100 156c-12 18-19 31-23 46 11-7 19-11 23-11s12 4 23 11c-4-15-11-28-23-46z" fill="url(#g-plume)"/>
        </g>
        <circle cx="100" cy="100" r="62" fill="url(#g-enc)"/>
        <g stroke="#3f7f9e" fill="none" opacity=".5" stroke-linecap="round">
            <path d="M76 138c8 8 16 13 24 15" stroke-width="2.4"/>
            <path d="M88 143c6 7 12 11 18 13" stroke-width="2"/>
            <path d="M104 152c6 4 12 7 18 7" stroke-width="1.8"/>
            <path d="M66 126c6 7 11 12 17 15" stroke-width="1.6"/>
        </g>
        <circle cx="72" cy="78" r="7" fill="#b9cede" opacity=".35"/>
        <circle cx="118" cy="66" r="4.5" fill="#b9cede" opacity=".3"/>
        <circle cx="100" cy="100" r="62" fill="url(#shade)"/>`;
    return `
        <circle cx="100" cy="100" r="62" fill="url(#g-k2)"/>
        <g opacity=".38">
            <path d="M40 84h120" stroke="#bcd6ff" stroke-width="7" opacity=".5"/>
            <path d="M44 104h112" stroke="#0f2c56" stroke-width="9" opacity=".55"/>
            <path d="M50 122h100" stroke="#bcd6ff" stroke-width="5" opacity=".4"/>
            <path d="M58 136h84" stroke="#0f2c56" stroke-width="6" opacity=".4"/>
        </g>
        <circle cx="100" cy="100" r="62" fill="url(#shade)"/>
        <circle cx="100" cy="100" r="66" fill="none" stroke="#9dc0ff" stroke-width="2" opacity=".22"/>`;
}

function orbSVG(w) {
    const R = 82, C = 2 * Math.PI * R;
    const frac = Math.min(w.probMid / ARC_MAX, 1);
    return `
    <svg class="bsg-orb" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="g-mars" cx="35%" cy="30%"><stop offset="0" stop-color="#f5a487"/><stop offset="55%" stop-color="#c2593c"/><stop offset="100%" stop-color="#6d2717"/></radialGradient>
        <radialGradient id="g-europa" cx="35%" cy="30%"><stop offset="0" stop-color="#fbf3e6"/><stop offset="55%" stop-color="#dcc7ab"/><stop offset="100%" stop-color="#7d6a58"/></radialGradient>
        <radialGradient id="g-enc" cx="35%" cy="28%"><stop offset="0" stop-color="#ffffff"/><stop offset="52%" stop-color="#cfe6f2"/><stop offset="100%" stop-color="#6d90a4"/></radialGradient>
        <radialGradient id="g-k2" cx="34%" cy="28%"><stop offset="0" stop-color="#8fb6ff"/><stop offset="52%" stop-color="#2f5c9e"/><stop offset="100%" stop-color="#0c1c3a"/></radialGradient>
        <radialGradient id="g-plume" cx="50%" cy="0%"><stop offset="0" stop-color="#cfeeff" stop-opacity=".75"/><stop offset="100%" stop-color="#cfeeff" stop-opacity="0"/></radialGradient>
        <radialGradient id="shade" cx="34%" cy="28%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#02040a" stop-opacity=".62"/></radialGradient>
      </defs>
      <circle class="bsg-glow" cx="100" cy="100" r="72" fill="${w.color}" opacity=".18" filter="blur(1px)"/>
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.4"/>
      <circle class="bsg-arc" cx="100" cy="100" r="${R}" fill="none" stroke="${w.color}" stroke-width="2.6"
              stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"
              transform="rotate(-90 100 100)"/>
      ${surface(w.id)}
    </svg>`;
}

/* ---- Build the stage ---- */
const stage = document.getElementById('bsgStage');
const rail = document.getElementById('bsgRail');
const detail = document.getElementById('bsgDetail');

WORLDS.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'bsg-world';
    btn.dataset.id = w.id;
    btn.style.setProperty('--c', w.color);
    if (w.gap) btn.style.setProperty('--gap', w.gap + 'px');
    btn.setAttribute('aria-label', w.name + ', probability of life ' + w.prob);
    btn.innerHTML = orbSVG(w) +
        '<span class="bsg-tag"><span class="bsg-tag-name">' + w.name + '</span>' +
        '<span class="bsg-tag-sub">' + w.prob + ' P(life)<span class="bsg-tag-n" data-count="' + w.id + '"></span></span></span>';
    btn.addEventListener('click', () => select(w.id));
    stage.appendChild(btn);

    const dot = document.createElement('div');
    dot.className = 'bsg-rail-dot';
    dot.dataset.dot = w.id;
    dot.style.left = (w.logX * 100) + '%';
    dot.style.setProperty('--c', w.color);
    rail.appendChild(dot);

    const lbl = document.createElement('div');
    lbl.className = 'bsg-rail-label';
    lbl.style.left = (w.logX * 100) + '%';
    lbl.textContent = w.where.split(' · ')[0];
    rail.appendChild(lbl);
});

/* SVG ids repeat across four inline SVGs; scope them per world so gradients
   do not collide when the same document holds all four. */
stage.querySelectorAll('.bsg-world').forEach(btn => {
    const id = btn.dataset.id;
    btn.innerHTML = btn.innerHTML
        .replace(/id="(g-[a-z0-9]+|shade)"/g, 'id="$1-' + id + '"')
        .replace(/url\(#(g-[a-z0-9]+|shade)\)/g, 'url(#$1-' + id + ')');
});

/* ---- Layout: measure the stage, then place the worlds so that no orb, label
   or rail ever crosses another or the frame.  Runs on load and on resize. ---- */
const LABEL_H = 36, RAIL_H = 44, PAD = 10;

function layoutWorlds() {
    const nodes = Array.from(stage.querySelectorAll('.bsg-world'));
    const narrow = window.innerWidth <= 900;
    const W = stage.clientWidth, H = stage.clientHeight;
    if (!W || !H) {                                /* stage not measured yet */
        if (window.requestAnimationFrame) requestAnimationFrame(layoutWorlds);
        return;
    }

    if (narrow) {                                  /* CSS grid handles placement */
        const size = Math.max(96, Math.min(W * 0.30, 150));
        nodes.forEach(n => { n.style.left = ''; n.style.top = ''; n.style.setProperty('--size', size + 'px'); });
        return;
    }

    const usableH = H - RAIL_H - PAD;
    const unit = Math.min(W / 4.9, usableH / 2.95);
    const placed = nodes.map(n => {
        const w = WORLDS.find(x => x.id === n.dataset.id);
        const size = Math.max(58, Math.min(unit * (w.size / 0.32), 188));
        return { node: n, w: w, size: size, gap: w.gap || 12,
                 cx: w.x / 100 * W, cy: PAD + (w.y / 100) * usableH };
    });

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
    placed.forEach(p => {
        p.cx = clamp(p.cx, p.size / 2 + 6, W - p.size / 2 - 6);
        p.cy = clamp(p.cy, PAD + p.size / 2, PAD + usableH - p.size / 2 - LABEL_H - p.gap);
    });

    /* push apart anything that would touch, then re-clamp to the frame */
    for (let pass = 0; pass < 24; pass++) {
        let moved = false;
        for (let i = 0; i < placed.length; i++) {
            for (let j = i + 1; j < placed.length; j++) {
                const a = placed[i], b = placed[j];
                const need = (a.size + b.size) / 2 + 18;
                const dx = b.cx - a.cx, dy = b.cy - a.cy;
                const dist = Math.hypot(dx, dy) || 0.001;
                if (dist >= need) continue;
                const push = (need - dist) / 2 + 0.5;
                const ux = dx / dist, uy = dy / dist;
                a.cx -= ux * push; a.cy -= uy * push;
                b.cx += ux * push; b.cy += uy * push;
                moved = true;
            }
        }
        placed.forEach(p => {
            p.cx = clamp(p.cx, p.size / 2 + 6, W - p.size / 2 - 6);
            p.cy = clamp(p.cy, PAD + p.size / 2, PAD + usableH - p.size / 2 - LABEL_H - p.gap);
        });
        if (!moved) break;
    }

    placed.forEach(p => {
        p.node.style.setProperty('--size', Math.round(p.size) + 'px');
        p.node.style.left = Math.round(p.cx) + 'px';
        p.node.style.top = Math.round(p.cy) + 'px';
    });
}

layoutWorlds();
if (window.ResizeObserver) new ResizeObserver(layoutWorlds).observe(stage);
window.addEventListener('resize', layoutWorlds);

/* ---- Starfield ---- */
(function stars() {
    const svg = document.getElementById('bsgStars');
    let seed = 20260829, out = '';
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let i = 0; i < 170; i++) {
        const x = (rnd() * 100).toFixed(2), y = (rnd() * 100).toFixed(2);
        const r = (rnd() * 1.15 + 0.25).toFixed(2), o = (rnd() * 0.5 + 0.12).toFixed(2);
        out += '<circle cx="' + x + '%" cy="' + y + '%" r="' + r + '" fill="#fff" opacity="' + o + '"/>';
    }
    svg.innerHTML = out;
})();

/* ---- Detail panel ---- */
let selected = null;

function select(id) {
    const w = WORLDS.find(x => x.id === id);
    if (!w) return;
    selected = id;
    stage.classList.add('bsg-dim');
    stage.querySelectorAll('.bsg-world').forEach(b => b.classList.toggle('on', b.dataset.id === id));
    rail.querySelectorAll('.bsg-rail-dot').forEach(d => d.classList.toggle('on', d.dataset.dot === id));

    detail.style.setProperty('--dc', w.color);
    detail.innerHTML =
        '<p class="bsg-detail-eyebrow">' + esc(w.sub) + '</p>' +
        '<h2>' + esc(w.name) + '</h2>' +
        '<p class="bsg-detail-where">' + esc(w.where) + '</p>' +
        '<div class="bsg-prob">' +
            '<div class="bsg-prob-top"><span class="bsg-prob-val">' + esc(w.prob) + '</span><span class="bsg-prob-key">Probability of life</span></div>' +
            '<div class="bsg-prob-track"><div class="bsg-prob-fill" style="width:' + Math.min(w.probMid / ARC_MAX * 100, 100) + '%"></div></div>' +
            '<p class="bsg-prob-note">' + esc(w.note) + '</p>' +
            '<span class="bsg-badge">' + esc(w.badge) + '</span>' +
        '</div>' +
        '<div class="bsg-block"><div class="bsg-block-key">Evidence</div><div class="bsg-block-text">' + esc(w.evidence) + '</div></div>' +
        '<div class="bsg-block"><div class="bsg-block-key">The case against</div><div class="bsg-block-text">' + esc(w.status) + '</div></div>' +
        '<div class="bsg-block"><div class="bsg-block-key">What would settle it</div>' +
            '<div class="bsg-block-text"><span class="bsg-mission-name">' + esc(w.mission) + '</span>' +
            '<div class="bsg-mission-when">' + esc(w.when) + '</div>' + esc(w.missionText) + '</div></div>' +
        "" +
        '';

    renderBodyCounts();
}

/* ============================================================
   2. The wire — github.com/WelcomeToYourGalaxy/space-life-news
   ============================================================ */
const REPO = 'WelcomeToYourGalaxy/space-life-news';
const BRANCH = 'main';
const ENDPOINTS = [
    () => 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/wire.json?t=' + Date.now(),
    () => 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH + '/wire.json'
];
const TOPIC_COLOR = {
    'mars': '#b58080', 'europa': '#86a5a5', 'enceladus': '#8ea2b8', 'k2-18b': '#93a3c0',
    'titan': '#a496b8', 'venus': '#c4a6a2', 'exoplanet': '#a8b79a', 'seti': '#b193a8', 'method': '#a49f98'
};

/* ============================================================
   Translation. Two independent things, because one of them can
   fail and the other cannot:

   1. In-place machine translation of the headlines and snippets
      you are looking at, through a free public endpoint. No key,
      no account. If it is unavailable the row falls back to the
      original text and says so rather than showing nothing.
   2. A per-row link that opens the article itself translated,
      which is a plain URL and works even when (1) does not.

   Machine translation is never presented as the publisher's own
   words: a translated row is marked, and the original title is
   kept on hover.
   ============================================================ */
const TR_LANGS = [
    ['off', 'Off — original'], ['en', 'English'], ['es', 'Español'], ['pt', 'Português'],
    ['fr', 'Français'], ['de', 'Deutsch'], ['it', 'Italiano'], ['nl', 'Nederlands'],
    ['sv', 'Svenska'], ['pl', 'Polski'], ['el', 'Ελληνικά'], ['ru', 'Русский'],
    ['uk', 'Українська'], ['tr', 'Türkçe'], ['ar', 'العربية'], ['he', 'עברית'],
    ['fa', 'فارسی'], ['hi', 'हिन्दी'], ['bn', 'বাংলা'], ['id', 'Bahasa Indonesia'],
    ['vi', 'Tiếng Việt'], ['th', 'ไทย'], ['ja', '日本語'], ['zh-CN', '简体中文'],
    ['zh-TW', '繁體中文'], ['ko', '한국어'], ['sw', 'Kiswahili']
];
const trCache = new Map();        // key: lang + '\u0000' + text
let trPending = false;

function trKey(lang, text) { return lang + '\u0000' + text; }

async function trOne(text, lang) {
    const endpoints = [
        () => 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
              lang + '&dt=t&q=' + encodeURIComponent(text),
        () => 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
              '&langpair=autodetect|' + lang
    ];
    for (let i = 0; i < endpoints.length; i++) {
        try {
            const res = await fetch(endpoints[i]());
            if (!res.ok) continue;
            const data = await res.json();
            if (i === 0 && Array.isArray(data) && Array.isArray(data[0])) {
                const out = data[0].map(seg => (seg && seg[0]) || '').join('');
                if (out.trim()) return out;
            }
            if (i === 1 && data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
        } catch (e) { /* try the next one */ }
    }
    return null;
}

async function trFill(items, lang, onDone) {
    // only what is on screen, and only what is not already cached
    const wanted = [];
    items.forEach(i => {
        [i.title, i.snippet].forEach(t => {
            if (t && !trCache.has(trKey(lang, t))) wanted.push(t);
        });
    });
    if (!wanted.length) { onDone(false); return; }

    trPending = true;
    let changed = false;
    const queue = wanted.slice(0, 120);
    async function worker() {
        while (queue.length) {
            const text = queue.shift();
            const out = await trOne(text, lang);
            trCache.set(trKey(lang, text), out || text);   // fall back to the original
            changed = true;
        }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    trPending = false;
    onDone(changed);
}

function trText(text, lang) {
    if (!text || lang === 'off') return text;
    const hit = trCache.get(trKey(lang, text));
    return hit === undefined ? text : hit;
}

/* the article itself, translated, as a plain link */
function trUrl(url, lang) {
    try {
        const u = new URL(url);
        return 'https://translate.google.com/translate?sl=auto&tl=' + lang +
               '&u=' + encodeURIComponent(u.href);
    } catch (e) { return url; }
}

const state = { tl: 'off', items: [], topics: [], languages: {}, sources: [], generated: null,
                topic: 'all', langs: new Set(), query: '', shown: 40, loading: false };

const $list = document.getElementById('bsgList');
const $status = document.getElementById('bsgStatus');
const $dot = document.getElementById('bsgDot');
const $prog = document.getElementById('bsgProgress');
const $more = document.getElementById('bsgMore');
const $topics = document.getElementById('bsgTopicChips');
const $langs = document.getElementById('bsgLangChips');
const $search = document.getElementById('bsgSearch');
const $srcGrid = document.getElementById('bsgSrcGrid');
const $refresh = document.getElementById('bsgRefresh');

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function timeAgo(ts) {
    if (!ts) return 'undated';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.round(h / 24);
    return d < 30 ? d + 'd ago' : new Date(ts).toISOString().slice(0, 10);
}
function langName(c) { return state.languages[c] || c; }
function topicLabel(id) { const t = state.topics.find(t => t.id === id); return t ? t.label : id; }
let lastStatus = '';
function refreshStatus() { if (lastStatus) $status.textContent = lastStatus; }
function setStatus(text, cls) { $status.textContent = text;
    if (text.indexOf('Translating') === -1) lastStatus = text; $dot.className = 'bsg-dot' + (cls ? ' ' + cls : ''); }

async function load() {
    if (state.loading) return;
    state.loading = true; $refresh.disabled = true; $prog.style.width = '40%';
    setStatus('Loading the wire…', '');

    let data = null, err = null;
    for (const ep of ENDPOINTS) {
        try {
            const res = await fetch(ep(), { cache: 'no-store' });
            if (!res.ok) { err = 'HTTP ' + res.status; continue; }
            data = await res.json(); break;
        } catch (e) { err = e.message; }
    }
    $prog.style.width = '100%';

    if (!data || !Array.isArray(data.items)) {
        state.loading = false; $refresh.disabled = false; $prog.style.width = '0';
        setStatus('The wire could not be read' + (err ? ' (' + err + ')' : '') + '. Press Refresh.', 'error');
        render(); return;
    }

    state.items = data.items.map(i => ({
        title: i.t, link: i.u, outlet: i.o, lang: i.g, region: i.r,
        kind: i.k,
        ll: (i.ll && i.ll.length === 2) ? i.ll : null, pin: i.pn || null, pa: !!i.pa, ts: i.d, snippet: i.s, topics: i.x || ['method']
    }));
    state.topics = data.topics || [];
    state.languages = data.languages || {};
    state.sources = data.sources || [];
    state.generated = data.generated ? Date.parse(data.generated) : null;

    buildChips(); renderSources();

    const c = data.counts || {};
    const ageH = state.generated ? (Date.now() - state.generated) / 3600000 : null;
    setStatus(
        (c.stories || state.items.length) + ' stories · ' +
        (c.languages || new Set(state.items.map(i => i.lang)).size) + ' languages · ' +
        (c.wires_ok || '?') + '/' + (c.wires_total || '?') + ' wires answered · harvested ' +
        (state.generated ? timeAgo(state.generated) : 'unknown'),
        ageH !== null && ageH > 6 ? 'idle' : ''
    );

    state.loading = false; $refresh.disabled = false;
    setTimeout(() => { $prog.style.width = '0'; }, 400);
    render();
}

function visible() {
    const q = state.query.toLowerCase();
    return state.items.filter(i => {
        if (state.topic !== 'all' && i.topics.indexOf(state.topic) === -1) return false;
        if (state.langs.size && !state.langs.has(i.lang)) return false;
        if (q && (i.title + ' ' + i.snippet + ' ' + i.outlet).toLowerCase().indexOf(q) === -1) return false;
        return true;
    }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
}

function render() {
    const items = visible(), slice = items.slice(0, state.shown);
    if (!slice.length) {
        $list.innerHTML = '<div class="bsg-state">' + (
            state.loading ? 'Loading the wire…'
            : state.items.length ? '<strong>Nothing matches these filters.</strong><br>Widen the subject or language, or clear the search.'
            : '<strong>No stories loaded.</strong><br>Press Refresh, or check that the harvester has run in the repository.'
        ) + '</div>';
        $more.style.display = 'none';
    } else {
        $list.innerHTML = slice.map(i => {
            const tags = i.topics.map(id => {
                const c = TOPIC_COLOR[id] || '#9fb0c8';
                return '<span class="bsg-t" style="color:' + c + ';border-color:' + c + '55">' + esc(topicLabel(id)) + '</span>';
            }).join('');
            return '<a class="bsg-item" href="' + esc(i.link) + '" target="_blank" rel="noopener noreferrer">' +
                '<div class="bsg-meta"><span class="bsg-lang">' + esc(langName(i.lang)) + '</span>' +
                '<span>' + esc(i.outlet) + '</span><span>' + esc(i.region) + (i.kind === 'preprint' ? ' · preprint' : '') + '</span>' +
                '<span>' + timeAgo(i.ts) + '</span>' +
                (state.tl !== 'off' ? '<span class="bsg-mt">machine translation</span>' : '') +
                '</div>' +
                '<div class="bsg-item-title"' + (state.tl !== 'off' ? ' title="' + esc(i.title) + '"' : '') + '>' + esc(trText(i.title, state.tl)) + '</div>' +
                (i.snippet ? '<div class="bsg-snip">' + esc(trText(i.snippet, state.tl)) + '</div>' : '') +
                '<div class="bsg-tags">' + tags + '</div></a>';
        }).join('');
        if (items.length > state.shown) {
            $more.textContent = 'Show more (' + (items.length - state.shown) + ' remaining)';
            $more.style.display = 'block';
            $list.appendChild($more);
        } else {
            $more.style.display = 'none';
        }
    }
    chipCounts();
    renderMap(items); renderBodyCounts();
}

function buildChips() {
    $topics.querySelectorAll('.bsg-chip').forEach(c => c.remove());
    $langs.querySelectorAll('.bsg-chip').forEach(c => c.remove());
    const all = document.createElement('button');
    all.className = 'bsg-chip' + (state.topic === 'all' ? ' on' : '');
    all.dataset.topic = 'all';
    all.innerHTML = 'All <span class="bsg-n"></span>';
    $topics.appendChild(all);
    state.topics.forEach(t => {
        const c = document.createElement('button');
        c.className = 'bsg-chip' + (state.topic === t.id ? ' on' : '');
        c.dataset.topic = t.id;
        c.style.setProperty('--chipcolor', TOPIC_COLOR[t.id] || '#e8eef7');
        c.innerHTML = esc(t.label) + ' <span class="bsg-n"></span>';
        $topics.appendChild(c);
    });
    // an explicit All chip: without one the only way back from a single
    // language was to untick it again
    const allLang = document.createElement('button');
    allLang.className = 'bsg-chip' + (state.langs.size ? '' : ' on');
    allLang.dataset.lang = 'all';
    allLang.innerHTML = 'All languages <span class="bsg-n"></span>';
    $langs.appendChild(allLang);
    Object.keys(state.languages).sort((a, b) => langName(a).localeCompare(langName(b))).forEach(code => {
        const c = document.createElement('button');
        c.className = 'bsg-chip' + (state.langs.has(code) ? ' on' : '');
        c.dataset.lang = code;
        c.innerHTML = esc(langName(code)) + ' <span class="bsg-n"></span>';
        $langs.appendChild(c);
    });
}

function chipCounts() {
    const q = state.query.toLowerCase();
    const base = state.items.filter(i => !q || (i.title + ' ' + i.snippet).toLowerCase().indexOf(q) !== -1);
    $topics.querySelectorAll('.bsg-chip').forEach(chip => {
        const id = chip.dataset.topic;
        const n = id === 'all' ? base.length : base.filter(i => i.topics.indexOf(id) !== -1).length;
        chip.querySelector('.bsg-n').textContent = n;
        chip.classList.toggle('empty', n === 0 && id !== 'all');
    });
    $langs.querySelectorAll('.bsg-chip').forEach(chip => {
        const code = chip.dataset.lang;
        const n = code === 'all' ? base.length : base.filter(i => i.lang === code).length;
        chip.querySelector('.bsg-n').textContent = n;
        chip.classList.toggle('empty', n === 0 && code !== 'all');
    });
}

function renderBodyCounts() {
    WORLDS.forEach(w => {
        const el = document.querySelector('[data-count="' + w.id + '"]');
        if (!el) return;
        const n = state.items.filter(i => i.topics.indexOf(w.id) !== -1).length;
        el.textContent = n ? ' · ' + n + ' live' : '';
    });
}

function renderSources() {
    const lc = document.getElementById('bsgLangCount'), rc = document.getElementById('bsgRegionCount');
    if (lc) lc.textContent = Object.keys(state.languages).length;
    if (rc) rc.textContent = new Set(state.sources.map(s => s.region)
        .filter(r => ['Institutional', 'Science desk', 'Preprints'].indexOf(r) === -1)).size;
    $srcGrid.innerHTML = state.sources.map(s =>
        '<div class="bsg-src ' + (s.ok ? '' : 'fail') + '"><span>' + esc(s.name) + '</span>' +
        '<span>' + (s.ok ? s.kept + ' kept' : 'unreachable') + '</span></div>').join('');
}

function focusTopic(id) {
    state.topic = id; state.shown = 40;
    $topics.querySelectorAll('.bsg-chip').forEach(c => c.classList.toggle('on', c.dataset.topic === id));
    render();
    const feed = document.getElementById('bsgFeed');
    if (feed && feed.scrollIntoView) feed.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$topics.addEventListener('click', e => {
    const chip = e.target.closest('.bsg-chip'); if (!chip) return;
    state.topic = chip.dataset.topic; state.shown = 40;
    $topics.querySelectorAll('.bsg-chip').forEach(c => c.classList.toggle('on', c === chip));
    render();
});
$langs.addEventListener('click', e => {
    const chip = e.target.closest('.bsg-chip'); if (!chip) return;
    const code = chip.dataset.lang;
    if (code === 'all') {
        state.langs.clear();
    } else if (state.langs.has(code)) {
        state.langs.delete(code);
    } else {
        state.langs.add(code);
    }
    // All is lit exactly when no single language is picked
    $langs.querySelectorAll('.bsg-chip').forEach(x => x.classList.toggle('on',
        x.dataset.lang === 'all' ? !state.langs.size : state.langs.has(x.dataset.lang)));
    state.shown = 40; render();
});
$refresh.addEventListener('click', load);
$more.addEventListener('click', () => { state.shown += 40; render(); });

/* method / sources sheets */
document.querySelectorAll('.bsg-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        const sheet = document.getElementById(tab.dataset.sheet);
        const opening = !sheet.classList.contains('open');
        document.querySelectorAll('.bsg-sheet').forEach(s2 => s2.classList.remove('open'));
        document.querySelectorAll('.bsg-tab').forEach(t => t.classList.remove('on'));
        if (opening) { sheet.classList.add('open'); tab.classList.add('on'); }
    });
});
document.querySelectorAll('.bsg-sheet [data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.closest('.bsg-sheet').classList.remove('open');
        document.querySelectorAll('.bsg-tab').forEach(t => t.classList.remove('on'));
    });
});
document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.bsg-sheet').forEach(s2 => s2.classList.remove('open'));
    document.querySelectorAll('.bsg-tab').forEach(t => t.classList.remove('on'));
});
document.getElementById('bsgClear').addEventListener('click', () => {
    state.topic = 'all'; state.langs.clear(); state.query = ''; state.shown = 40; $search.value = '';
    $topics.querySelectorAll('.bsg-chip').forEach(c => c.classList.toggle('on', c.dataset.topic === 'all'));
    $langs.querySelectorAll('.bsg-chip').forEach(c => c.classList.toggle('on', c.dataset.lang === 'all'));
    render();
});
let timer;
$search.addEventListener('input', e => {
    clearTimeout(timer); const v = e.target.value;
    timer = setTimeout(() => { state.query = v; state.shown = 40; render(); }, 180);
});

select('enceladus');

/* translation control */
(function () {
    const sel = document.getElementById('bsgTr');
    if (!sel) return;
    TR_LANGS.forEach(pair => {
        const o = document.createElement('option');
        o.value = pair[0]; o.textContent = pair[1];
        sel.appendChild(o);
    });
    sel.value = 'off';
    sel.addEventListener('change', () => {
        state.tl = sel.value;
        state.shown = 40;
        render();
        if (state.tl === 'off') { refreshStatus(); return; }
        const onscreen = visible().slice(0, state.shown);
        setStatus('Translating ' + onscreen.length + ' headlines…', '');
        trFill(onscreen, state.tl, () => { render(); refreshStatus(); });
    });
})();

load();
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);

let satFills = [], satParts = [];
const SAT = {
    sat: 1.15,    // above 1, so surfaces stay different from each other
    con: 1.05,
    bright: 1.06,
    hue: -6,      // degrees, warms the greens off satellite's blue-green
    green: 0.30,  // soft-light green over land: tints without flattening
    warm: 0.22,   // overlay gold: the sunlit look
    sea: 0.55,
    shade: 0.45   // relief: the sculpted part
};
const FAN_STEP = 8.5;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const FAN_ZOOM_FLOOR = 5;

function initMap() {
    if (bsgMap || typeof L === 'undefined' || mapBroken) return;
    const el = document.getElementById('bsgMap');
    if (!el) return;
    bsgMap = L.map(el, { worldCopyJump: true, zoomControl: true, attributionControl: true })
             .setView([20, 10], 1);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        noWrap: true,
        bounds: [[-85.05, -180], [85.05, 180]],
        updateWhenZooming: false,
        keepBuffer: 2,
        attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
    }).addTo(bsgMap);
    bsgLayer = L.layerGroup().addTo(bsgMap);
    dressSatellite();
    setTimeout(() => bsgMap.invalidateSize(), 60);
    window.addEventListener('resize', () => bsgMap.invalidateSize());
}

function dressSatellite() {
    if (!bsgMap || typeof L === 'undefined') return;
    try {
        const pane = (name, z, blend) => {
            if (!bsgMap.getPane(name)) bsgMap.createPane(name);
            const el = bsgMap.getPane(name);
            el.style.zIndex = z;
            el.style.pointerEvents = 'none';
            if (blend) el.style.mixBlendMode = blend;
            return el;
        };
        const fillPane = (name, z, blend, colour, opacity) => {
            const el = pane(name, z, blend);
            const d = document.createElement('div');
            d.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;background:' +
                              colour + ';opacity:' + opacity + ';';
            el.appendChild(d);
            satFills.push(d);
            satParts.push(el);
            return { el: el, fill: d };
        };

        // the imagery's own filter
        const sp = bsgMap.getPane('tilePane');
        if (sp) sp.style.filter = 'saturate(' + SAT.sat + ') contrast(' + SAT.con +
            ') brightness(' + SAT.bright + ') hue-rotate(' + SAT.hue + 'deg)';

        // water first, under the land washes, so the sea is softened by them
        const seaL = fillPane('satSea', 205, 'screen', '#0f3b52', SAT.sea);
        // soft-light rather than color: it shifts hue in proportion to how light
        // a pixel already is, so ploughland goes green and dark rock stays dark
        const greenL = fillPane('satWash', 210, 'soft-light', '#5f8f3a', SAT.green);
        // overlay lifts highlights and deepens shadows at once — most of what
        // makes a map read as lit rather than scanned
        const warmL = fillPane('satWarm', 214, 'overlay', '#f0c073', SAT.warm);

        const shadeEl = pane('satShade', 220, 'multiply');
        satParts.push(shadeEl);
        const shade = L.tileLayer(
            'https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}',
            { pane: 'satShade', opacity: SAT.shade, maxZoom: 16, maxNativeZoom: 16,
              noWrap: true, bounds: [[-85.05, -180], [85.05, 180]],
              updateWhenZooming: false, keepBuffer: 2, attribution: 'Hillshade © Esri' });

        // a layer that cannot load is dropped rather than left half-drawn
        const guard = (layer, name, onGone) => {
            let n = 0;
            layer.on('tileerror', () => {
                if (++n === 12) {
                    try { bsgMap.removeLayer(layer); } catch (e) { /* already gone */ }
                    try { onGone && onGone(); } catch (e) { /* nothing to undo */ }
                    console.warn('map: ' + name + ' failed repeatedly; dropped');
                }
            });
            layer.addTo(bsgMap);
        };
        guard(shade, 'hillshade', () => {
            // without relief the washes are just a colour cast on a photograph
            greenL.el.style.display = 'none';
            warmL.el.style.display = 'none';
            if (sp) sp.style.filter = '';
        });

        /* The painted plate. Below the fade window the map reads as a drawn
           chart; zoom past it and the plate cross-fades away to the imagery
           underneath. Purely decorative — interactive:false, so it never
           intercepts a click on a pin.
         *
         * The southern edge is the version from the social-spheres map. The
         * art here previously ended on a ruled horizontal line a little below
         * the compass rose: opaque ocean, hard seam, then nothing. The paint
         * below that line was still in the file — only its mask had been cut
         * square — so this carries the social-spheres alpha envelope across
         * the same rows, and the chart now thins out through the forties
         * instead of stopping at a straight edge. The title plaque keeps its
         * own mask, or it would take the other map's lettering with it. */
        const plateEl = pane('plate', 250);
        satParts.push(plateEl);
        const PLATE_S = -80.55, PLATE_N = 85.05112877980659;
        const PLATE_FADE_IN = 3, PLATE_FADE_OUT = 5.6;
        let plate = null;
        try {
            plate = L.imageOverlay(PLATE_IMG, [[PLATE_S, -180], [PLATE_N, 180]],
                { pane: 'plate', interactive: false }).addTo(bsgMap);
        } catch (e) { console.warn('map: plate overlay unavailable:', e); }
        const blendPlate = () => {
            if (!plate) return;
            try {
                const z = bsgMap.getZoom();
                const t = Math.max(0, Math.min(1, (z - PLATE_FADE_IN) / (PLATE_FADE_OUT - PLATE_FADE_IN)));
                const op = 1 - t;
                if (op <= 0.001) { if (bsgMap.hasLayer(plate)) bsgMap.removeLayer(plate); }
                else { if (!bsgMap.hasLayer(plate)) plate.addTo(bsgMap); plate.setOpacity(op); }
                el.classList.toggle('plated', op > 0.02);
            } catch (e) { /* not ready yet */ }
        };
        // zoomanim fires while the zoom is animating, so the plate dissolves
        // through the gesture rather than stepping at the end of it
        bsgMap.on('zoomend zoomanim', blendPlate);
        bsgMap.on('zoomend', resizePins);
        bsgMap.whenReady(blendPlate);
        blendPlate();

        // A flat fill inside a Leaflet pane is nailed to the map, not the screen:
        // pan far enough and its edge crosses the view as a hard line. These
        // carry no geography, so they follow the screen instead — repositioned
        // against the map pane's own offset on every move.
        const cover = () => {
            try {
                const mp = bsgMap.getPanes().mapPane;
                const o = L.DomUtil.getPosition(mp) || { x: 0, y: 0 };
                const sz = bsgMap.getSize();
                const m = 400;
                satFills.forEach(d => {
                    d.style.left = (-o.x - m) + 'px';
                    d.style.top = (-o.y - m) + 'px';
                    d.style.width = (sz.x + m * 2) + 'px';
                    d.style.height = (sz.y + m * 2) + 'px';
                });
            } catch (e) { /* mid-gesture, next move fixes it */ }
        };

        // Tints ease off as you zoom in: wide out they do the work, close in
        // they cover the detail somebody zoomed in to see. Relief does the
        // reverse — it is wanted more at valley scale.
        const ramp = () => {
            try {
                const z = bsgMap.getZoom();
                const t = z <= 6 ? 1 : z >= 13 ? 0.45 : 1 - (z - 6) * (0.55 / 7);
                greenL.fill.style.opacity = SAT.green * t;
                warmL.fill.style.opacity = SAT.warm * t;
                seaL.fill.style.opacity = SAT.sea * (z <= 6 ? 1 : 0.7);
                shade.setOpacity(z <= 4 ? SAT.shade * 0.8 : SAT.shade);
            } catch (e) { /* not ready yet */ }
        };
        bsgMap.on('zoomend', ramp);
        bsgMap.on('move zoom zoomend moveend resize viewreset', cover);
        bsgMap.whenReady(() => { ramp(); cover(); });
        ramp(); cover();
    } catch (err) {
        console.warn('map: satellite treatment skipped:', err);
    }
}

function renderMap(items) {
    try { renderMapInner(items); }
    catch (err) {
        // a broken map is a missing panel, never a missing feed
        mapBroken = true;
        const wrap = document.getElementById('bsgMapWrap');
        if (wrap) wrap.style.display = 'none';
        console.warn('map disabled:', err);
    }
}

function renderMapInner(items) {
    if (typeof L === 'undefined' || mapBroken) {
        const wrap = document.getElementById('bsgMapWrap');
        if (wrap) wrap.style.display = 'none';
        return;
    }
    initMap();
    if (!bsgMap || !bsgLayer) return;
    bsgLayer.clearLayers();
    bsgPins = [];

    // Every story gets its own pin. Stories resolving to the same place would
    // otherwise sit on top of each other, so each is nudged onto a ring around
    // the point — deterministic, so a pin does not move between renders.
    const seenAt = new Map();
    let mapped = 0, unplaced = 0, approx = 0;

    items.forEach(i => {
        if (!i.ll || i.ll.length !== 2) { unplaced++; return; }
        mapped++;
        if (i.pa) approx++;
        const key = i.ll[0] + ',' + i.ll[1];
        const n = seenAt.get(key) || 0;
        seenAt.set(key, n + 1);

        /* Where a story sits when others share its coordinate — see fanOffset. */
        const off = n > 0 ? fanOffset(n, i.link) : { dx: 0, dy: 0 };

        const entry = { item: i, at: i.ll.slice(), base: key, dx: off.dx, dy: off.dy,
                        colour: TOPIC_COLOR[i.topics[0]] || '#a49f98',
                        full: i.score >= state.docScore ? 13 : 10,
                        approx: !!i.pa,
                        dim: n > 0 ? 0.92 : 1 };
        entry.at = fanned(entry);
        const marker = L.marker(entry.at, { icon: pinIcon(entry), title: i.title }).addTo(bsgLayer);
        entry.marker = marker;
        bsgPins.push(entry);
        marker.on('click', () => openPinPopup(entry));
    });

    const c = document.getElementById('bsgMapCount');
    const u = document.getElementById('bsgMapUnplaced');
    if (c) c.textContent = mapped + (mapped === 1 ? ' story mapped' : ' stories mapped') +
        (approx ? ' \u00b7 ' + approx + ' by source country' : '');
    if (u) u.textContent = unplaced ? unplaced + ' unplaced' : '';
    state.mapped = mapped;
    state.unplaced = unplaced;
}

function hashSeed(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967296;        // 0…1, stable for a given link
}

function fanOffset(n, link) {
    const j = hashSeed(link || String(n));
    const angle = n * GOLDEN_ANGLE + (j - 0.5) * 0.7;
    const r = FAN_STEP * Math.sqrt(n) * (0.85 + j * 0.3);
    return { dx: Math.cos(angle) * r, dy: Math.sin(angle) * r };
}

function fanned(entry) {
    if (!entry.dx && !entry.dy) return entry.item.ll;
    let z = FAN_ZOOM_FLOOR;
    try { z = Math.max(FAN_ZOOM_FLOOR, bsgMap.getZoom()); } catch (e) { /* not ready */ }
    const unit = 360 / (256 * Math.pow(2, z));
    const lat = entry.item.ll[0], lon = entry.item.ll[1];
    const cos = Math.max(0.2, Math.cos(lat * Math.PI / 180));
    return [lat + entry.dy * unit * cos, lon + entry.dx * unit];
}

function pinScale() {
    let z = 3;
    try { z = bsgMap.getZoom(); } catch (e) { /* not ready; assume mid */ }
    if (z <= 1) return 0.52;
    if (z >= 6) return 1;
    return 0.52 + (z - 1) * (0.48 / 5);
}

function pinIcon(entry) {
    const size = Math.max(5, Math.round(entry.full * pinScale()));
    const thin = size < 9 ? ' bsg-pin-sm' : '';
    return L.divIcon({
        className: '',
        html: '<div class="bsg-pin' + thin + (entry.approx ? ' bsg-pin-approx' : '') + '" style="width:' + size + 'px;height:' + size +
              'px;background:' + entry.colour + ';color:' + entry.colour + ';opacity:' + entry.dim + ';"></div>',
        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
    });
}

function resizePins() {
    try {
        bsgPins.forEach(e => {
            e.marker.setIcon(pinIcon(e));
            if (e.dx || e.dy) {
                e.at = fanned(e);
                e.marker.setLatLng(e.at);
            }
        });
    } catch (err) { /* mid-render */ }
}

function neighboursOf(entry) {
    const group = [entry];
    if (!bsgMap) return group;
    let here;
    try { here = bsgMap.latLngToContainerPoint(entry.at); }
    catch (e) { return group; }
    bsgPins.forEach(other => {
        if (other === entry) return;
        if (other.base === entry.base) { group.push(other); return; }   // same place, always
        try {
            const p = bsgMap.latLngToContainerPoint(other.at);
            const dx = p.x - here.x, dy = p.y - here.y;
            if (Math.sqrt(dx * dx + dy * dy) <= PIN_NEIGHBOUR_PX) group.push(other);
        } catch (e) { /* ignore an unplottable neighbour */ }
    });
    return group;
}

function openPinPopup(entry) {
    if (!bsgMap) return;
    const group = neighboursOf(entry);
    const places = [];
    group.forEach(g => {
        const nm = (g.item.pin || "");
        if (places.indexOf(nm) === -1) places.push(nm);
    });
    const head = '<div class="bsg-pop-place">' + esc(places.slice(0, 3).join(' · ')) +
                 (group.length > 1 ? ' · ' + group.length + ' stories here' : '') + '</div>';
    const rows = group.slice(0, 20).map((g, n) =>
        '<a href="' + esc(g.item.link) + '" target="_blank" rel="noopener noreferrer"' +
        (n === 0 && group.length > 1 ? ' class="bsg-pop-first"' : '') + '>' +
        esc(trText(g.item.title, state.tl)) +
        '<span class="bsg-pop-src">' + esc(g.item.source) +
        (places.length > 1 ? ' · ' + esc((g.item.pin || "")) : '') + '</span></a>').join('');
    const more = group.length > 20 ? '<div class="bsg-pop-place">and ' + (group.length - 20) + ' more</div>' : '';
    L.popup({ maxWidth: 300, autoPan: true })
     .setLatLng(entry.at)
     .setContent(head + rows + more)
     .openOn(bsgMap);
}

})();
